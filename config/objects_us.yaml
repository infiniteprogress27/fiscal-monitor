          - {name: CBO PAYGO estimates(逐案), freq: 事件, kind: PDF}

      - id: impoundment
        name: 行政扣款与ICA
        grp: 支出上限与财政规则
        view: qual_only
        status_line: stage
        verified: "2026-08-06"
        laws: [ica, ada]
        watch_pages:
          - {id: apportionment-db, url: "https://apportionment-public.max.gov/", name: Apportionment库}
        links:
          - {name: OMB Apportionment公开库, url: "https://apportionment-public.max.gov/"}
          - {name: OpenOMB镜像, url: "https://openomb.org/"}
          - {name: GAO Appropriations Law裁定, url: "https://www.gao.gov/legal/appropriations-law"}
        qual:
          state: 活跃博弈。apportionment公开库经诉讼恢复(25/8), 26/1法院进一步令公开spend plans, 政府上诉中(D.C.巡回)
          base_case: OMB继续以footnote条件、慢分配、pocket rescission测试ICA边界; 库的可用性本身是信号
          watch: A类footnote附条件的新apportionment; rescission special message(45天窗口); GAO B系列裁定; 上诉裁决
          mechanism: >
            冻结资金不需要正式rescission: 附条件footnote或拖延apportionment即可实现事实扣款。
            ICA程序: rescission需国会45天内批准, deferral仅限三种法定理由。
            GAO裁定是违法认定的权威来源(先例: 乌克兰援助案)。
        sources:
          - {name: OMB Public Apportionments Database, freq: 持续, kind: HTML}
          - {name: GAO Appropriations Law decisions, freq: 事件, kind: HTML}

  # ================================================================
  - id: L2
    name: 预算
    time_mode: 流程定位, 按财年周期(实例化, 历史归档)
    objects:

      - id: cbo_baseline
        name: CBO基线与评分中枢
        view: baseline_center
        status_line: stage
        verified: "2026-08-07"
        laws: [cba]
        links:
          - {name: CBO机读数据页, url: "https://www.cbo.gov/data/budget-economic-data"}
          - {name: Cost Estimates检索, url: "https://www.cbo.gov/cost-estimates"}
        watch_pages:
          - {id: cbo-data-page, url: "https://www.cbo.gov/data/budget-economic-data", name: CBO数据页}
        qual:
          state: 现行基线1月版, 夏季更新待发(约8/20); 版本间移动看三因素分解
          base_case: 夏季版计入年内立法与关税收入重估; 立法评分经监听器自动捕获(congress.gov关联CBO estimates)
          watch: 三因素分解中立法项的构成; IEEPA判决对关税收入假设的冲击; ACA延长案若成法+$28B/yr入基线
          mechanism: >
            基线是全系统的锚工厂: CBR起点、302(a)参照、收支进度对比的路径锚、所有评分的参照系。
            版本路径与分解为低频人工锚(年2-3次, 页面监听触发提醒); 法案评分发布由立法监听器自动捕获。
        baseline_changes:
          - {version: 2026-01版, legislative: -410, economic: 120, technical: 45, note: 计入OBBBA与关税}
          - {version: 2026-05版, legislative: -15, economic: 40, technical: 25, note: 春季更新·关税收入上调}
        scores:
          - {bill: S.3385, name: ACA补贴3年延长, score: "+$82.9B/3yr", status: CBO已评(2025-12), note: 参院僵持}
          - {bill: H.R.7567, name: Farm Bill, score: 待录入, status: 委员会报告随附, note: 监听器捕获新评分后更新}
          - {bill: H.R.8870, name: BUILD America 250, score: 待评分, status: floor前, note: "$580B/5yr授权额非评分"}
        sources:
          - {name: 10-Year Budget Projections(xlsx), freq: 年2-3次, kind: 机读}
          - {name: Changes in Baseline(三因素), freq: 随更新, kind: xlsx}
          - {name: congress.gov API cboCostEstimates字段, freq: 逐案, kind: API·监听}

      - id: budget_cycle
        name: 预算周期
        view: cycle_instances
        status_line: stage
        verified: "2026-08-07"
        laws: [cba]
        qual:
          state: 周期对象按财年实例化, 当前活跃FY2027; 历史财年归档可回看
          base_case: FY2027无两院CBR, 302(a)以各院自设/deeming方式确立
          watch: 参院预算决议动向; MSR(已逾7/15 DDL)发布
        instances:
          - fy: 2027
            active: true
            threea: "302(a)确立: 无两院一致CBR; 众院经H.Con.Res.113自设topline, 参院未定(deeming待观察)"
            flow_states:
              pb1: done
              pb2: done
              pb3: done
              pb4: done
