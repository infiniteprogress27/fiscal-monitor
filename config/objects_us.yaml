  - id: L4
    name: 发行
    time_mode: QRA季度周期
    objects:

      - id: qra_cycle
        name: QRA周期
        view: qra_view
        status_line: stage
        verified: "2026-08-10"
        qual:
          state: "8/5 Statement: coupon结构维持不变; 前瞻指引延续; QRFE历史与coupon结构见下"
          base_case: coupon尺寸维持至FY27中, 增量融资靠Tbills; 卖方共识增coupon窗口在2027年8月起
          watch: QRFE三指标vs卖方锚; 前瞻指引措辞diff; TBAC专题
          mechanism: >
            周一QRFE(融资估计)→周三Statement+TBAC文件包。QRFE表纵向为季度(近3年),
            横向为两指标: 私人持有净融资、期末TGA假设。coupon结构表为月度各期限拍卖规模,
            下图为2007年以来长历史(含QRA后的已公告路径)。
        sources:
          - {name: QRA文件包(数值每季人工录入qra_history), freq: 季, kind: HTML, link: "https://home.treasury.gov/policy-issues/financing-the-government/quarterly-refunding"}
          - {name: auctions_query(coupon尺寸推导), freq: 逐场, kind: API}
          - {name: 卖方preview, freq: 季, kind: 人工锚}

      - id: gross_issuance
        name: 总发行对照
        view: issuance_view
        status_line: text
        text_status: "国债月度总发行(拍卖实况) vs 企业债发行(SIFMA口径锚); 挤出效应观察窗"
        verified: "2026-08-12"
        qual:
          state: 国债侧2000年起全自动; 企业债为SIFMA月度口径人工锚(对话更新)
          watch: 企业债放量月份与国债拍卖尾部的同月相关; 发债窗口对拍卖日历的避让
          mechanism: >
            国债=当月全部拍卖接纳额加总(bills+coupon, 拍卖实况); 企业债=SIFMA投资级+高收益
            月度总发行。两者之和即固收一级市场月度总供给, 企业债占比走高的月份是挤出观察点。
        sources:
          - {name: auctions_query(全场次2000+), freq: 周, kind: API}
          - {name: SIFMA公司债月度统计, freq: 月, kind: 人工锚·对话更新}

      - id: auction_demand
        name: 拍卖需求结构
        view: demand_heatmap
        status_line: text
        text_status: "Coupon一级市场投资者类别配售份额, 月度×年份热力表"
        verified: "2026-08-12"
        qual:
          state: 五类投资者月度配售份额; 基金持续吸收交易商让出的份额是结构主线
          watch: Investment funds份额新高; SOMA再投资月份挤占; 海外份额趋势位
          mechanism: >
            数据为财政部Investor Class Auction Allotments月度报告(Coupon口径), 官方为XLS无API,
            更新通道=对话转换(上传xls或数值即转)。色阶为该类别历史分位: 红高蓝低。
        sources:
          - {name: Treasury Investor Class Auction Allotments, freq: 月, kind: XLS·对话转换}

      - id: funding_forecast
        name: 财年融资预测
        view: funding_widget
        status_line: stage
        verified: "2026-08-10"
        qual:
          state: FY2026-2028三年联动模型; 基线赤字自动取CBO现行版, 八项假设可编辑, 全表实时重算
          base_case: bills为残差调节阀; coupon不加码则bills占比持续上行穿越区间
          watch: 预测的bills占比路径vs TBAC 15-20%建议区间; 与卖方Exhibit式测算对照
          mechanism: >
            勾稽链: 赤字+其他调整=融资需求; ΔTGA(期末假设-期初, 跨年链式)加总得borrowing need;
            净coupon=总拍卖-公众到期(总到期-Fed rollover)-回购; 净bills=需求-净coupon(残差);
            期末存量=期初+净供给, 跨年滚动; bills%=期末bills/期末marketable;
            私人bills%=(期末bills-SOMA bills)/(marketable-SOMA总持仓)。编辑存本机, 清除即回官方默认。
        sources:
          - {name: CBO基线(赤字默认值), freq: 年2-3次, kind: 联动}
          - {name: MSPD/供给(期初存量), freq: 月, kind: API}
          - {name: 其余假设, freq: 每QRA后校准, kind: 手动输入}

      - id: cash_buyback
        name: TGA与回购管理
        view: cash_buyback
        status_line: tga
        verified: "2026-08-10"
        qual:
          state: TGA目标水位附近; 回购双轨常规运行(流动性支持每季envelope约$30B+现金管理季节性)
          base_case: TGA维持$850B-1T区间; 回购envelope随QRA微调
          watch: TGA vs 目标偏离; offer-to-max(需求侧压力); envelope是否扩容或引入switch
          mechanism: >
            回购二分: 流动性支持回购=周度常规操作, 买入off-the-run老券缓解做市商资产负债表,
            每季度按bucket设上限(envelope); 现金管理回购=围绕缴税日的季节性操作,
            用现金高峰赎回短端、削融资波动。两者都不改变久期政策含义, 与QT方向无关。
        sources:
          - {name: DTS operating_cash_balance, freq: 日, kind: API}
          - {name: FiscalData Buybacks(逐CUSIP), freq: 逐场, kind: API}
          - {name: 回购schedule(每QRA后录入), freq: 季, kind: 手动}

