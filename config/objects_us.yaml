# 美国财政对象注册表
# 组织单元 = 财政对象。每个对象是一份活档案: 状态行 / 工作视图 / 档案(折叠)。
# 日历节点单一归属于对象, 全局时钟条是视图聚合。
# 本文件为定性层唯一维护点, 定量由 fetch_us.py 落至 data/us/, 渲染由 build_site.py 按 id 绑定。

country: US
