  - id: L3
    name: 收支
    time_mode: 年度结构 + 财年进度对比
    objects:

      - id: annual_progress
        name: 年度收支进度
        view: annual_widget
        status_line: fytd
        verified: "2026-08-08"
        qual:
          state: 上图下表联动; 默认六线=收/支/赤绝对额+各自/NGDP; 点击表行切换为该科目双轴视图
          watch: 关税与净利息是结构变化最快的两个科目; Mandatory/Discretionary比价长期漂移
          mechanism: >
            年度序列=历年9月MTS的FYTD值(即全年实际); 当年为FYTD截至最新月。
            NGDP为财年均值(FRED, 日历年近似)。占比列: 收入科目/收入合计, 支出科目/支出合计。
            5年走势列为yoy%迷你线。层级: 收入(5科目) / 支出(强制性4+自由裁量2+净利息) / 赤字与初级赤字。
        sources:
          - {name: MTS table 4/5 (历年9月+当年FYTD), freq: 月, kind: API}
          - {name: FRED GDP (NGDP财年均值), freq: 季, kind: API}
          - {name: CBO Historical Budget Data (校验源), freq: 年, kind: 机读}

      - id: mts_progress
        name: 月度收支进度
        view: fytd_progress
        status_line: fytd
        verified: "2026-08-08"
        qual:
          state: FYTD四类线=当年+近6财年+CBO基线路径+DTS预测点; FY2026累计略高于可比带上沿
          base_case: 全年落在CBO锚附近, 关税收入与利息支出是两侧主要变量
          watch: MBR先行估计与MTS落地偏差及归因; DTS预测点与随后MTS的偏差(校准楔子用); 4/6/9/1缴税大月
          mechanism: >
            锚链条 DTS(日)→DTS预测点(本系统)→MBR(月初,±5bn)→MTS(实际)。
            DTS预测: 月内已实现现金赤字(存取款剔除国债发行/赎回) + 近3年同月MTS均值×未过日比例。
            现金vs权责口径楔子未校正, 定位为MTS前方向性锚, 精度弱于MBR; 预测点用空心菱形+虚线, 与实际严格区分。
        sources:
          - {name: MTS table 1 (8财年窗口), freq: 月8-12号, kind: API}
          - {name: DTS deposits_withdrawals (剔债务流), freq: 日, kind: API}
          - {name: CBO Monthly Budget Review, freq: 月初, kind: PDF}

      - id: local_fiscal
        name: 地方收支
        view: local_widget
        status_line: text
        text_status: "州地方年度收支与央地划分; 转移支付为勾稽线"
        verified: "2026-08-11"
        qual:
          state: 联邦/州地方四线对照+联邦转移支付; 点击表行切换分项双轴视图
          watch: 联邦转移占州地方收入比(依赖度); 州地方自有收入增速vs支出刚性
          mechanism: >
            总量五序列走NIPA口径(FRED镜像, 季度年化取年均); 州地方自有收入=总收入-联邦转移。
            四大税种分项走Census QTAX季度调查(自动, 滞后约一季, 日历年加总);
            支出功能分项(教育/公共福利等)暂无同时效公开源, 保持Census年度人工锚。
            NIPA/QTAX/Census三口径并存, 表内不跨源相减。
        sources:
          - {name: FRED/NIPA(总量五序列), freq: 季, kind: API}
          - {name: Census QTAX(四大税种), freq: 季·滞后一季, kind: API}
          - {name: Census州地方财政年度调查(分项), freq: 年·滞后2年, kind: 人工锚}
        anchors_census:
          as_of: FY2022
          spending:
            - {item: 教育(K12+高教), bn: 1090}
            - {item: 公共福利(含Medicaid州付), bn: 940}
            - {item: 公路交通, bn: 210}
            - {item: 公共安全, bn: 260}
            - {item: 其他, bn: 1300}


