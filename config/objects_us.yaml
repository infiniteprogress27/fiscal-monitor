        qual:
          state: FY2027无法定cap(FRA随FY2025到期), 现行约束只剩302(a)/(b)程序性上限
          base_case: 两院topline谈判决定事实上限; 参院要求国防/非国防同步增长
          watch: "302(b)分配表更新(链接直达); 是否立法设新cap; cap外渠道(紧急指定/和解注入)规模——见年度财政扩张对象"
          mechanism: 法定cap超限触发OMB全面削减(15日内); 程序上限靠point of order执行, 众院特别规则可豁免, 参院需60票
        caps_table:
          - {fy: FY2027, defense: 无法定cap, nondefense: 无法定cap, note: "众院topline合计$1,856B(+13%), FY2026 enacted $1,639B; 参院未定"}
          - {fy: FY2025(FRA), defense: "$895.2B", nondefense: "$710.7B", note: "已执行完毕, FRA到期"}
          - {fy: FY2024(FRA), defense: "$886.3B", nondefense: "$703.7B", note: 另有转移基座类调整在cap外}
          - {fy: FY2012-21(BCA), defense: 逐年cap, nondefense: 逐年cap, note: "四次BBA两党协议上调, 2013年触发过sequester"}
        sources:
          - {name: 两院302(b)分配表, freq: 年度+修订, kind: HTML解析}
          - {name: OMB Sequestration报告, freq: 年随PB, kind: PDF}

