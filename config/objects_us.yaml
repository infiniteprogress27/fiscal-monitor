          - {name: CBO PAYGO估计, url: "https://www.cbo.gov/topics/budget"}
        qual:
          state: 记分卡已于2025年末被整体清零(H.R.5371), OBBBA约$3.4T借记连同4% Medicare sequester一并豁免; 2026年新立法重新累积
          base_case: 下次结算=第119届国会结束后14日(约2027-01下旬); 历史零触发, 年末照例豁免
          watch: 2026年内新增记分(ACA延长案若过会显著入账); 豁免条款挂哪个载体
          mechanism: 5年/10年双记分卡取大者, 借记触发强制性支出sequester(Medicare限4%); 豁免三法= 不记分条款/清零/直接豁免
        scorecard:
          - {item: 5年/10年记分卡余额, value: "0 (2025-12清零)", note: H.R.5371随CR清除~$3.4T OBBBA借记}
          - {item: 被豁免的sequester, value: "4% Medicare + 其他强制性", note: "原定2026-02-01生效, CBO估FY2026 Medicare削减约$45B"}
          - {item: 2026年新累积, value: 累积中, note: 下次OMB报告 ~2027-01}
          - {item: 豁免先例, value: TCJA(2018)/ARPA(2021)/OBBBA(2025), note: 零触发纪录延续}
        sources:
