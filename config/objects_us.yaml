      # ---------------- 总债务结构与债务上限 ----------------
      - id: debt_structure
        name: 总债务结构
        grp: 总债务结构与债务上限
        view: debt_tiers
        status_line: debt_tiers
        verified: "2026-08-06"
        qual:
          state: 各口径量级见下表; 政府间债务90%为GAS(信托基金记账), 限额内≈总债务-FFB等
          watch: 公众持有/政府间的分解漂移(信托基金由盈转亏会压低政府间份额); 净金融资产口径受学生贷款政策影响
          mechanism: >
            口径瀑布: 总债务 = 公众持有 + 政府间(GAS+FFB+少量marketable)。
            公众持有净金融资产 = 公众持有 - 现金余额(TGA) - 贷款类金融资产(直接贷款为主, 高教占90%+)。
            限额内债务 = 总债务 - 财政部外机构债务(FFB/TVA等) ± 未摊销调整项。
            权威源: 日度Debt to the Penny; 月度MSPD含限额对账表; 净口径见CBO年度报告。
        sources:
          - {name: Debt to the Penny, freq: 日, kind: API}
          - {name: MSPD 债限对账, freq: 月, kind: API}
          - {name: CBO Federal Debt Primer(净口径), freq: 年, kind: PDF}

      - id: debt_limit
        name: 债务上限
        grp: 总债务结构与债务上限
        view: debt_limit
        status_line: headroom
        verified: "2026-08-06"
        laws: [pl119-21]
        qual:
          state: 有空间。限额$41.1T (P.L.119-21, 2025-07-04上调$5T), 限额内债务约$39.8T
          base_case: 按当前赤字节奏, 2027年上半年再次达限; 达限后EM(G-Fund为主, 约$300-400B)可再撑数月
          watch: DTS限额内债务日度逼近速度; SLGS停售公告(达限前兆); 财长致国会信(X日一手估计)
          mechanism: >
            达限后顺序: EM置换腾空间 → 调减Tbills → 减coupon → X日。
            解决路径: 常规立法(需60票)或和解程序(51票, 每财年一次机会)。
            X日估计三源: 财长信 / CBO专题 / BPC追踪, 取估计带而非点。
            图中限额空档=暂停期(suspension, 无限额), 暂停结束按实际发生额重置。法定限额史可回溯1917(统一限额制1939), 实际线2005年前为年度总债务近似(DTS日度自2005/6)。
        limit_history:
          - {from: "1990-11", limit: 4145}
          - {from: "1993-08", limit: 4900}
          - {from: "1996-03", limit: 5500}
          - {from: "1997-08", limit: 5950}
          - {from: "2002-06", limit: 6400}
          - {from: "2003-05", limit: 7384}
          - {from: "2004-11", limit: 8184}
          - {from: "2006-03", limit: 8965}
          - {from: "2007-09", limit: 9815}
          - {from: "2008-07", limit: 10615}
          - {from: "2008-10", limit: 11315}
          - {from: "2009-02", limit: 12104}
          - {from: "2009-12", limit: 12394}
          - {from: "2010-02", limit: 14294}
          - {from: "2011-08", limit: 16394, note: BCA分步上调}
          - {from: "2013-02", limit: null, note: 暂停}
          - {from: "2013-05", limit: 16699}
          - {from: "2013-10", limit: null, note: 连续两次暂停}
          - {from: "2015-03", limit: 18113}
          - {from: "2015-11", limit: null}
          - {from: "2017-03", limit: 19809}
          - {from: "2017-09", limit: null}
          - {from: "2017-12", limit: 20456}
          - {from: "2018-02", limit: null}
          - {from: "2019-03", limit: 22030}
          - {from: "2019-08", limit: null}
          - {from: "2021-08", limit: 28401}
          - {from: "2021-10", limit: 28881}
          - {from: "2021-12", limit: 31381}
          - {from: "2023-06", limit: null, note: FRA暂停}
          - {from: "2025-01", limit: 36104}
          - {from: "2025-07", limit: 41100, note: OBBBA +$5T}
        sources:
          - {name: DTS debt_subject_to_limit(日/史), freq: 日, kind: API}
          - {name: MSPD 债限对账表, freq: 月, kind: API}
          - {name: 财长致国会信 + EM描述文件, freq: 事件, kind: PDF, link: "https://home.treasury.gov/policy-issues/financial-markets-financial-institutions-and-fiscal-service/debt-limit"}
          - {name: BPC X日追踪, freq: 事件, kind: 三方, link: "https://bipartisanpolicy.org/debt-limit/"}

      # ---------------- 支出上限与财政规则 ----------------
      - id: caps_sequestration
        name: 支出上限与Sequestration
        grp: 支出上限与财政规则
        view: caps_view
        status_line: stage
        verified: "2026-08-06"
        laws: [cba, bbedca, fra]
        watch_pages:
          - {id: crs-approps-status, url: "https://crsreports.congress.gov/AppropriationsStatusTable", name: CRS拨款状态表}
          - {id: house-approps-leg, url: "https://appropriations.house.gov/legislation", name: 众院拨款委法案页(302b)}
        links:
