        name: 支出约束 · 骨太目安与基本财政收支目标
        view: spending_rules
        status_line: text
        text_status: "软约束体系: PB目标(骨太方针) · 社保/非社保目安 · 概算请求基准 · 防卫¥43T计划"
        verified: "2026-09-08"
        qual:
          state: 当初预算口径一般会计PB转正(FY2026); 骨太方针2026于7/21决定(PB目标表述待核); ¥140T请求若大幅保留将逆转PB
          watch: 6月骨太方针的目标年份措辞; 补充预算规模对PB实绩的侵蚀; 中长期测算7月版
