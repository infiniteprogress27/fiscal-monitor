layers:
  - id: L1
    name: 规则与立法
    objects:
      - id: tax_legislation_jp
        name: 立法 · 税制与财源
        view: tax_legislation_jp
        status_line: text
        text_status: "消费税减税之议 · 防卫财源 · 育儿支援金 · 年末税制改正为年度决胜点"
        verified: "2026-09-08"
        qual:
          state: 高市政权'负责任的积极财政'; FY2026税制改正已生效项(所得税壁·汽油暂定税率废止), 消费税减税未纳入
          base_case: 2026年末税制改正聚焦防卫财源所得税附加时点与给付附带税额抵免设计; 消费税率不动
          watch: 在野党消费税减税法案; 税收超收规模(决算剩余金去向); 防卫特别法人税首年入库
        sources:
          - {name: 财务省税制改正大纲, freq: 年(12月), kind: 人工锚}
          - {name: 国会审议(众参财政金融委), freq: 会期, kind: 人工锚}
      - id: deficit_authority
        name: 发行合法性约束 · 特例国债法
        view: deficit_authority
        status_line: text
        text_status: "特例国债法5年延长(FY2026-30)审议中→授权到期FY2030是硬节点; 60年偿还规则维持"
        verified: "2026-09-08"
        qual:
          state: 特例国债连续第33年发行; 授权立法从逐年审议变为5年一次, 财政民主主义之争在野党提起
          watch: 特例国债法成立确认; 60年规则脱钩讨论; 前倒债限额¥50T使用
          mechanism: 财政法第4条禁止赤字国债, 特例法是例外授权; 授权期是日本唯一的'发行硬约束'节点, 对应美国债限的功能位置但无额度上限
        sources:
          - {name: 财务省国债发行计划, freq: 年+改定, kind: 人工锚}
          - {name: 国会法案数据库, freq: 会期, kind: 人工锚}
