name: update-dashboard
# 三层调度: 同一workflow, cron表达式路由模式
#   daily    22:30 UTC 周二至周六 — 日度源全拉 + 账本到期检查按需拉月度文件
#   intraday 17:45 & 21:00 UTC 工作日 — 仅拍卖/回购日生效, 无事件秒退不提交
#   weekly   周一 12:00 UTC — 慢频源 + 账本窗口前滚
on:
  schedule:
    - cron: "30 22 * * 2-6"
    - cron: "45 17 * * 1-5"
    - cron: "0 21 * * 1-5"
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [daily, intraday, weekly, sample]
        default: daily
permissions:
  contents: write
concurrency:
  group: fiscal-update
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Resolve mode
        id: m
        run: |
          case "${{ github.event.schedule }}" in
            "30 22 * * 2-6") MODE=daily ;;
            "45 17 * * 1-5"|"0 21 * * 1-5") MODE=intraday ;;
            "0 12 * * 1") MODE=weekly ;;
            *) MODE="${{ inputs.mode || 'daily' }}" ;;
          esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
      - run: pip install -r requirements.txt
      - run: python scripts/run.py --mode ${{ steps.m.outputs.mode }}
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
      - name: Commit if changed
        run: |
          git config user.name fiscal-bot
          git config user.email actions@github.com
          git add data/us docs
          git diff --cached --quiet || git commit -m "auto[${{ steps.m.outputs.mode }}]: $(date -u +%FT%H:%M)"
          git push
